<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lifeos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="symbol-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#lifeos-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Logo Emblem: Modern Stylized 'L' + Spark/Infinity Loop -->
  <g filter="url(#shadow)">
    <!-- L Spine -->
    <path d="M 148 128 C 148 114.7 158.7 104 172 104 L 180 104 C 193.3 104 204 114.7 204 128 L 204 316 L 332 316 C 345.3 316 356 326.7 356 340 L 356 348 C 356 361.3 345.3 372 332 372 L 172 372 C 158.7 372 148 361.3 148 348 Z" fill="url(#symbol-grad)"/>
    
    <!-- Dynamic Accent Spark (Life Spark) -->
    <path d="M 324 164 Q 356 164 356 132 Q 356 164 388 164 Q 356 164 356 196 Q 356 164 324 164 Z" fill="#FFE4E6"/>
    <circle cx="356" cy="244" r="18" fill="white" fill-opacity="0.9"/>
  </g>
</svg>
