<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />

		<!-- Standalone-/App-Verhalten für installierte PWA (u. a. Galaxy Z Fold Cover-Display) -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Life OS" />
		<meta id="theme-color-meta" name="theme-color" content="#FFF4E0" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<script>
			// Setzt Thema und Darstellungs-Attribute vor dem ersten Rendern (kein Aufblitzen).
			// Quellen: Geräte-Einstellungen und die Kopie der Nutzer-Einstellungen
			// (das Profil ist beim ersten Rendern noch nicht geladen). Jeder Zugriff darf scheitern.
			(function () {
				var el = document.documentElement;
				var lies = function (schluessel) {
					try {
						return JSON.parse(localStorage.getItem(schluessel) || '{}') || {};
					} catch (e) {
						return {};
					}
				};
				var geraet = lies('lifeos:geraet:v1');
				var spiegel = lies('lifeos:darstellung-spiegel');
				var setze = function (name, wert) {
					el.setAttribute('data-' + name, wert);
				};

				var thema = geraet['darstellung.thema'];
				if (thema !== 'hell' && thema !== 'dunkel' && thema !== 'system') {
					// Alt-Schlüssel aus der Zeit vor T301; themeState übernimmt ihn einmalig.
					var alt = null;
					try {
						alt = localStorage.getItem('theme');
					} catch (e) {}
					thema = alt === 'dark' ? 'dunkel' : alt === 'light' ? 'hell' : 'system';
				}
				var dunkel = thema === 'dunkel';
				if (thema === 'system') {
					try {
						dunkel = window.matchMedia('(prefers-color-scheme: dark)').matches;
					} catch (e) {}
				}
				el.classList.toggle('dark', dunkel);

				if (geraet['darstellung.dichte'] === 'kompakt') setze('dichte', 'kompakt');
				var schrift = String(geraet['darstellung.schrift']);
				if (schrift === '112' || schrift === '125') setze('schrift', schrift);
				if (geraet['darstellung.bewegung'] === 'reduziert') setze('bewegung', 'reduziert');
				if (geraet['darstellung.kanten'] === 'gerundet') setze('kanten', 'gerundet');
				if (geraet['darstellung.muster'] === false) setze('muster', 'aus');

				var signal = spiegel['darstellung.signal'];
				if (signal === 'gelb' || signal === 'limette' || signal === 'orange' || signal === 'blau')
					setze('signal', signal);
				if (spiegel['darstellung.farbintensitaet'] === 'gedaempft') setze('farben', 'gedaempft');
				if (spiegel['darstellung.sticker'] === false) setze('sticker', 'aus');

				// Status-Bar-Farbe passend zum Thema, damit die installierte App nahtlos wirkt.
				var meta = document.getElementById('theme-color-meta');
				if (meta) meta.setAttribute('content', dunkel ? '#141414' : '#FFF4E0');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-seite text-tinte antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
